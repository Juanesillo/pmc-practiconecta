services:
  pmc:
    build: .
    restart: unless-stopped
    ports:
      # Solo accesible desde el propio servidor y desde contenedores (Caddy), no desde internet.
      - "172.17.0.1:8082:3000"
    environment:
      DEMO: "1"                 # "0" desactiva el acceso rápido sin contraseña
    volumes:
      - pmc-data:/data
volumes:
  pmc-data:
