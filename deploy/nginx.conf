server {
    listen 80;
    server_name _;   # cambia por tu dominio o IP

    root /var/www/pmc;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Solo se sirve el sitio, no archivos internos
    location ~ /\.(git|gitignore) { deny all; }
    location = /README.md { deny all; }
}
